name: Aktionen sammeln

on:
  schedule:
    # Täglich 04:00 UTC. Die Portale aktualisieren nachts, morgens steht der
    # Feed dann fertig im Repo.
    - cron: "0 4 * * *"
  # Damit eine geänderte Quelle sofort geprüft wird, statt bis zum nächsten
  # Nachtlauf zu warten. Vor dem Merge ist das ausserdem der einzige Weg, den
  # Sammellauf überhaupt zu starten: GitHub kennt `schedule` und
  # `workflow_dispatch` nur für Workflow-Dateien auf dem Standardbranch.
  # `data/**` ist bewusst nicht dabei — sonst löste der eigene Commit den
  # nächsten Lauf aus.
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      inspect:
        description: >-
          Name einer Quelle aus sources.yaml. Gesetzt, wird nichts geschrieben —
          stattdessen landet der Seitenaufbau im Job-Log, um Selektoren abzulesen.
        required: false
        default: ""
      only:
        description: "Nur diese eine Quelle laufen lassen"
        required: false
        default: ""
      roh:
        description: >-
          CSS-Selektor, dessen Treffer im Rohtext ausgegeben werden. Nur
          zusammen mit `inspect`. Dafür da, einen umgebauten Seitenaufbau
          abzulesen, statt den neuen Selektor zu raten.
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Parser-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r scraper/requirements.txt

      # Laufen gegen gespeicherte HTML-Fixtures, brauchen kein Netz.
      - name: Tests
        working-directory: scraper
        run: python -m pytest

  inspect:
    name: Seitenaufbau ansehen
    if: github.event_name == 'workflow_dispatch' && inputs.inspect != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r scraper/requirements.txt

      - name: Struktur ausgeben
        run: |
          if [ -n "${{ inputs.roh }}" ]; then
            python scraper/inspect_source.py \
              --source "${{ inputs.inspect }}" \
              --roh "${{ inputs.roh }}" --roh-anzahl 3
          else
            python scraper/inspect_source.py --source "${{ inputs.inspect }}"
          fi

  scrape:
    name: Feed aktualisieren
    if: github.event_name != 'workflow_dispatch' || inputs.inspect == ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r scraper/requirements.txt

      - name: Aktionen sammeln
        env:
          # Nur fuer die Erstanbieter-Quellen: Seiten ohne JSON-LD wertet ein
          # Modell aus. Fehlt das Secret, ueberspringt der Lauf diesen Schritt
          # und meldet das einmal — der Job bleibt gruen, die Portalquellen
          # laufen unveraendert weiter.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GZG_MODELL: ${{ vars.GZG_MODELL }}
          GZG_EFFORT: ${{ vars.GZG_EFFORT }}
        run: |
          python -m gzg_scraper.run \
            --sources sources.yaml \
            --output ../data/actions.json \
            --delay 3 \
            ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}
        working-directory: scraper

      # Ohne diesen Blick ins Log sieht man erst am Handy, ob die Selektoren
      # Unsinn geliefert haben — ein Titel wie "Mehr anzeigen" oder ein Betrag,
      # der in Wahrheit ein Datum war.
      - name: Ergebnis zur Kontrolle ausgeben
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          daten = json.loads(Path("data/actions.json").read_text(encoding="utf-8"))
          aktionen = daten["actions"]
          print(f"{len(aktionen)} Aktionen, Stand {daten['generated_at']}\n")
          for aktion in aktionen:
              betrag = aktion["max_refund_cents"]
              print(
                  f"  [{aktion['source']}] {aktion['title'][:70]}\n"
                  f"      Art={aktion['type']} "
                  f"Betrag={'—' if betrag is None else f'{betrag / 100:.2f} €'} "
                  f"Frist={aktion['submission_deadline'] or '—'} "
                  f"Zeitraum={aktion['valid_from'] or '—'}..{aktion['valid_to'] or '—'}\n"
                  f"      {aktion['url']}"
              )
          PY

      # Nur auf dem Standardbranch schreiben. Vorher committete jeder Lauf auf
      # jedem Zweig — und weil die App den Feed ohnehin von `main` holt, brachte
      # das auf einem Arbeitszweig nichts ausser einem Konflikt in
      # data/actions.json bei jedem Merge. Das Log oben bleibt: Daran sieht man
      # auf einem Zweig, ob geaenderte Selektoren taugen.
      - name: Änderungen committen
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- data/actions.json; then
            echo "Keine Änderungen an data/actions.json."
            exit 0
          fi

          anzahl=$(python -c "import json;print(len(json.load(open('data/actions.json'))['actions']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actions.json
          git commit -m "Aktionen aktualisiert (${anzahl} Einträge)"
          git push
