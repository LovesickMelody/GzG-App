name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug-APK und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew test --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gzg-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release-APK veroeffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Der `secrets`-Kontext ist in Step-`if` nicht verfuegbar, `env` schon.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      # Optional: nur wenn die Secrets hinterlegt sind. Ohne Keystore signiert
      # der Release-Build mit dem Debug-Key (siehe README) und ist trotzdem
      # installierbar — nur nicht fuer den Play Store geeignet.
      - name: Keystore aus Secret schreiben
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        run: ./gradlew assembleRelease --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/gzg-tracker-${GITHUB_REF_NAME}.apk"

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GZG-Tracker $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.apk
