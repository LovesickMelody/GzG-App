name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug-APK und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew test

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      # Nur wenn wirklich etwas schiefging — spart Artifact-Speicher.
      - name: Testberichte hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Weg 1 zur APK: Artifact. Bequem, zaehlt aber gegen das Artifact-Kontingent
      # des Kontos. Ist es voll, schlaegt nur dieser Schritt fehl.
      - name: Debug-APK hochladen
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gzg-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hinweis bei vollem Artifact-Speicher
        if: steps.apk_artifact.outcome == 'failure'
        run: |
          echo "::warning::Artifact-Upload fehlgeschlagen (meist volles Speicherkontingent)." \
               "Die APK haengt stattdessen am Prerelease 'debug-latest'."

  # Ein gruener Compile beweist nicht, dass die App startet. Dieser Job installiert
  # die APK auf einem echten Emulator und laesst sie laufen — er faengt Abstuerze
  # durch Hilt, Room, DataStore oder fehlende Ressourcen ab, die der Compiler nicht
  # sehen kann.
  smoke:
    name: App auf Emulator starten
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      # Ohne KVM laeuft der Emulator in Software und braucht ein Vielfaches der Zeit.
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests auf dem Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # `default` statt `google_apis`: Die App braucht keine Play Services —
          # das ML-Kit-Barcode-Modell ist mit einkompiliert.
          target: default
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ACHTUNG: Der Emulator-Runner führt jede Zeile einzeln über `sh -c` aus.
          # Eine mit `\` umgebrochene Zeile kommt deshalb halbiert an — Gradle sah
          # zuletzt einen Task namens `\`. Jeder Befehl gehört auf **eine** Zeile.
          #
          # Startet die App wirklich, tragen Room, Hilt und DataStore, funktioniert
          # die Navigation? Wird das rot, ist die App kaputt.
          script: ./gradlew connectedDebugAndroidTest

      - name: Testberichte hochladen
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # Weg 2 zur APK: ein mitlaufendes Prerelease. Release-Assets zaehlen nicht gegen
  # das Artifact-Kontingent, die APK ist also auch dann erreichbar, wenn Weg 1 klemmt.
  debug-release:
    name: Debug-APK als Prerelease
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      # Der Dateiname traegt den Commit. Vorher hiess jede APK gleich und lag
      # unter derselben Adresse — und GitHubs Auslieferungsnetz hat weiter die
      # alten Bytes geschickt, obwohl das Asset laengst ersetzt war. Am Geraet
      # sah es aus, als waeren die Aenderungen nicht drin; sie waren es, nur
      # nicht in der ausgelieferten Datei. Mit dem Commit im Namen gibt es fuer
      # jeden Stand eine eigene Adresse, die nichts Altes verdecken kann.
      - name: Prerelease aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kurz="${GITHUB_SHA:0:7}"
          datei="gzg-tracker-debug-${kurz}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/$datei"
          gh release delete debug-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create debug-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Debug-APK ($kurz)" \
            --notes "Automatisch gebaut aus \`$GITHUB_REF_NAME\` ($GITHUB_SHA), $(date -u '+%d.%m.%Y %H:%M') UTC. Zum Ausprobieren, nicht zum Aufheben." \
            --prerelease \
            "dist/$datei"

          groesse=$(stat -c%s "dist/$datei")
          echo "::notice::APK $datei — $((groesse / 1048576)) MB"

  release:
    name: Release-APK veroeffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Der `secrets`-Kontext ist in Step-`if` nicht verfuegbar, `env` schon.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      # Ohne Keystore wird hier abgebrochen, nicht ersatzweise mit dem Debug-Key
      # signiert. Eine debug-signierte APK unter einem Versionsnamen sieht echt
      # aus, taugt aber nicht fuer Play — und wer sie installiert hat, bekommt
      # spaeter kein Update auf die richtig signierte Fassung, weil Android eine
      # andere Signatur als andere App behandelt.
      - name: Keystore aus Secret schreiben
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt. Ein Release ohne eigenen Keystore" \
                 "waere mit dem Debug-Key signiert und fuer Play unbrauchbar." \
                 "Anleitung: README, Abschnitt \"Für den Play Store signieren\"."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Aus v1.2.3 wird versionCode 10203. Play verlangt fuer jeden Upload einen
      # hoeheren Wert; aus dem Tag abgeleitet kann man das nicht vergessen.
      - name: Version aus dem Tag ableiten
        run: |
          name="${GITHUB_REF_NAME#v}"
          haupt=$(echo "$name" | cut -d. -f1)
          neben=$(echo "$name" | cut -d. -f2)
          klein=$(echo "$name" | cut -d. -f3 | cut -d- -f1)
          code=$(( ${haupt:-0} * 10000 + ${neben:-0} * 100 + ${klein:-0} ))
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "::notice::$GITHUB_REF_NAME → versionName $name, versionCode $code"

      # Play nimmt fuer neue Apps kein APK mehr an, sondern ein App Bundle.
      # Die APK bleibt trotzdem dabei — fuer alle, die ohne Play installieren.
      - name: Release bauen (Bundle und APK)
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PsigningRequired \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      # Gegenprobe statt Vertrauen: Steht hier der Debug-Key, ging oben etwas
      # schief, und es faellt vor der Veroeffentlichung auf statt danach.
      - name: Signatur prüfen
        run: |
          werkzeuge=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$werkzeuge/apksigner" verify --print-certs "$apk" | tee signatur.txt

          if grep -qi "CN=Android Debug" signatur.txt; then
            echo "::error::Die APK ist mit dem Debug-Key signiert — nicht veroeffentlichen."
            exit 1
          fi
          echo "::notice::$(grep -m1 'certificate SHA-256' signatur.txt || echo 'Signatur geprüft')"

      - name: Dateien sammeln
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/gzg-tracker-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/gzg-tracker-${GITHUB_REF_NAME}.aab"

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GZG-Tracker $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.apk dist/*.aab
