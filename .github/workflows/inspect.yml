name: Portale ansehen

# Vorübergehender Hilfs-Workflow, um echte, erreichbare Quellen zu finden und
# daraus Selektoren abzuleiten.
#
# Warum nicht scrape.yml: GitHub startet `workflow_dispatch` und `schedule` nur für
# Workflow-Dateien auf dem Standardbranch. `push` dagegen greift auf jedem Branch —
# darüber kommt der Job an die Portale, solange der Feature-Branch noch offen ist.
#
# Verschwindet wieder, sobald die Quellen in sources.yaml stehen.

on:
  push:
    paths:
      - "scraper/sources.yaml"
      - "scraper/kandidaten.txt"
      - "scraper/probe_kandidaten.py"
      - "scraper/inspect_source.py"
      - ".github/workflows/inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansehen:
    name: Kandidaten abklopfen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten
        run: pip install -r scraper/requirements.txt

      # Die Kandidatenliste ist einmal durchgelaufen, das Ergebnis steht in
      # scraper/kandidaten.txt. Wer sie erneut braucht, hängt hier
      # `python scraper/probe_kandidaten.py` an — jeder Lauf kostet die
      # Portale Traffic, deshalb nicht dauerhaft.

      # Klassennamen allein reichen nicht — erst am Markup sieht man, ob der
      # Betrag im Text oder in einem Attribut steht und welcher Link zur Aktion
      # führt statt zu einem Anker auf derselben Seite.
      - name: geldzurueck.deals im Rohbau
        continue-on-error: true
        run: >-
          python scraper/inspect_source.py
          --url https://geldzurueck.deals/
          --roh "div.card" --roh-anzahl 2

      - name: rabattigel.de im Rohbau
        continue-on-error: true
        run: >-
          python scraper/inspect_source.py
          --url https://rabattigel.de/cashback/
          --roh "article.rgu-card" --roh-anzahl 2

      - name: Konfigurierte Quellen prüfen
        continue-on-error: true
        run: |
          python - <<'PY'
          import subprocess, sys, yaml
          from pathlib import Path

          quellen = yaml.safe_load(Path("scraper/sources.yaml").read_text())["sources"]
          for quelle in quellen:
              if not quelle.get("enabled"):
                  continue
              print(f"\n\n########## {quelle['name']} ##########")
              subprocess.run(
                  [sys.executable, "scraper/inspect_source.py", "--source", quelle["name"]],
                  check=False,
              )
          PY
